<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
#stage{position:fixed;inset:0;overflow:hidden}
.pet{position:absolute;width:192px;height:208px;transform-origin:50% 100%;will-change:left,top;pointer-events:none}
.pet canvas{width:192px;height:208px;image-rendering:pixelated;display:block}
.pet .badge{position:absolute;top:4px;right:8px;font-size:24px;line-height:1;display:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.pet.stopped{opacity:.55}
.pet.stopped .badge{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<script src="overlay.js"></script>
</body>
</html>
